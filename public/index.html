<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>賠率研究室 Odds Study</title>
<meta name="description" content="用數學看台灣運彩：公平機率、估計賠率、每一注平均拿回多少。教學用途。" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://sports-proxy.pengzjay.workers.dev" crossorigin />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="loading" class="loading" role="status" aria-live="polite">
  <div class="loading-box">
    <img class="loading-logo" src="./favicon.svg" alt="" width="64" height="64" />
    <p class="loading-title">賠率研究室 · Odds Study</p>
    <div id="loading-spinner" class="spinner" aria-hidden="true"></div>
    <p id="loading-text"></p>
    <div id="loading-bar" class="loading-bar"><span id="loading-fill"></span></div>
    <p id="loading-eta" class="loading-eta"></p>
    <div id="loading-error" class="loading-error" hidden>
      <p id="loading-error-text"></p>
      <div class="button-row">
        <button id="loading-reload" class="ghost-button" type="button">重新整理 · Reload</button>
        <button id="loading-skip" class="ghost-button" type="button">直接開啟 · Open anyway</button>
      </div>
    </div>
  </div>
</div>
<script>
  // Failsafe that doesn't depend on the app's own scripts: if they fail to
  // load or never start, offer a way out instead of an endless loading screen.
  (function () {
    var zh = /^zh/i.test(navigator.language || '');
    function $(id) { return document.getElementById(id); }
    window.__oddsFail = function (message) {
      if ($('loading').hidden) return;
      $('loading-error-text').textContent = message || (zh ? '頁面沒有正常啟動，可能是網路不穩。' : "The page didn't start, maybe a network hiccup.");
      $('loading-error').hidden = false;
      $('loading-spinner').hidden = true;
    };
    $('loading-reload').onclick = function () { location.reload(); };
    $('loading-skip').onclick = function () { $('loading').hidden = true; };
    window.addEventListener('error', function () { if (!window.__oddsStarted) window.__oddsFail(); });
    setTimeout(function () { if (!window.__oddsStarted) window.__oddsFail(); }, 15000);
  })();
</script>
<main class="page">
  <header class="masthead">
    <img class="brand-logo" src="./favicon.svg" alt="" width="44" height="44" />
    <div>
      <h1 id="title">賠率研究室</h1>
      <p id="subtitle" class="subtitle"></p>
    </div>
  </header>

  <p id="notice" class="notice" role="note"></p>

  <div class="status-row">
    <p id="status" class="muted" aria-live="polite"></p>
    <button id="refresh" class="ghost-button" type="button"></button>
  </div>

  <nav id="sport-filter" class="day-filter" aria-label="sport"></nav>

  <nav id="tabs" class="tabs" role="tablist">
    <button id="tab-games" class="tab" role="tab" type="button" data-tab="games" data-t="tab_games"></button>
    <button id="tab-slip" class="tab" role="tab" type="button" data-tab="slip"></button>
    <button id="tab-sim" class="tab" role="tab" type="button" data-tab="sim" data-t="tab_sim"></button>
    <button id="tab-math" class="tab" role="tab" type="button" data-tab="math" data-t="tab_math"></button>
  </nav>

  <div id="panel-games" class="tab-panel" role="tabpanel" aria-labelledby="tab-games">
    <nav id="day-filter" class="day-filter" aria-label="day"></nav>
    <details id="ranking" class="card ranking-card">
      <summary><h2 id="ranking-title"></h2><span class="summary-hint" data-t="rankingHint"></span></summary>
      <p class="intro" data-t="rankingIntro"></p>
      <ol id="ranking-list" class="ranking-list"></ol>
    </details>

    <section id="games" aria-labelledby="games-title">
      <h2 id="games-title"></h2>
      <p class="intro" data-t="gamesIntro"></p>
      <details class="explain"><summary data-t="marginsHelpTitle"></summary><p data-t="marginsHelp"></p></details>
      <div id="games-list" class="games-list"></div>
    </section>

    <section id="futures" aria-labelledby="futures-title">
      <h2 id="futures-title"></h2>
      <p class="intro" data-t="futuresIntro"></p>
      <div id="futures-list" class="games-list"></div>
    </section>

    <section id="f1" class="card" aria-labelledby="f1-title">
      <h2 id="f1-title"></h2>
      <p class="intro" data-t="f1Intro"></p>
      <div id="f1-body"></div>
    </section>
    </div>

  <div id="panel-slip" class="tab-panel" role="tabpanel" aria-labelledby="tab-slip">
    <section id="parlay" class="card" aria-labelledby="parlay-title">
      <h2 id="parlay-title"></h2>
      <p class="intro" data-t="parlayIntro"></p>
      <div id="parlay-body"></div>
    </section>
    </div>

  <div id="panel-sim" class="tab-panel" role="tabpanel" aria-labelledby="tab-sim">
    <section id="sim" class="card" aria-labelledby="sim-title">
      <h2 id="sim-title"></h2>
      <p class="intro" data-t="simIntro"></p>
      <div class="sim-controls">
        <label><span data-t="simPeriod"></span>
          <select id="sim-weeks">
            <option value="4">4</option>
            <option value="13">13</option>
            <option value="26">26</option>
            <option value="52" selected>52</option>
            <option value="156">156</option>
          </select>
        </label>
      </div>
      <div id="sim-headline" class="sim-headline" aria-live="polite"></div>
      <div id="sim-stats" class="stat-row"></div>
      <div id="sim-legend" class="legend"></div>
      <div id="sim-chart" class="chart"></div>
      <div id="sim-players" class="players"></div>
      <h3 class="sub-title" data-t="habitsTitle"></h3>
      <p id="habits-intro" class="intro"></p>
      <ol id="sim-habits" class="ranking-list"></ol>
      <h3 class="sub-title" data-t="fansTitle"></h3>
      <p id="fans-intro" class="intro"></p>
      <ol id="sim-fans" class="ranking-list"></ol>
      <h3 class="sub-title" data-t="storiesTitle"></h3>
      <p class="intro" data-t="storiesIntro"></p>
      <ul id="sim-stories" class="stories"></ul>
      <h3 class="sub-title" data-t="truthsTitle"></h3>
      <ul id="sim-truths" class="facts truths"></ul>
      <h3 class="sub-title" data-t="factsTitle"></h3>
      <ul id="sim-facts" class="facts"></ul>
      <details class="table-view">
        <summary data-t="simTable"></summary>
        <div id="sim-table"></div>
      </details>
    </section>
    </div>

  <div id="panel-math" class="tab-panel" role="tabpanel" aria-labelledby="tab-math">
    <section id="math" class="card" aria-labelledby="math-title">
      <h2 id="math-title"></h2>
      <div id="math-body"></div>
    </section>
    </div>

  <footer><p id="footer" class="muted"></p></footer>
</main>
<script type="module" src="./app.js" onerror="window.__oddsFail()"></script>
</body>
</html>
