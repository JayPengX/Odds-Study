      <p id="loading-error-text"></p>
      <div class="button-row">
        <button id="loading-reload" class="ghost-button" type="button">重新整理 · Reload</button>
        <button id="loading-skip" class="ghost-button" type="button">直接開啟 · Open anyway</button>

<script>
  // Failsafe that doesn't depend on the app's own scripts: if they fail to
  // load or never start, offer a way out instead of an endless loading screen.
  (function () {
    var zh = /^zh/i.test(navigator.language || '');
    function $(id) { return document.getElementById(id); }
    window.__oddsFail = function (message) {
      if ($('loading').hidden) return;
      $('loading-error-text').textContent = message || (zh ? '頁面沒有正常啟動，可能是網路不穩。' : "The page didn't start, maybe a network hiccup.");
      $('loading-error').hidden = false;
      $('loading-spinner').hidden = true;
    };
    $('loading-reload').onclick = function () { location.reload(); };
    $('loading-skip').onclick = function () { $('loading').hidden = true; };
    window.addEventListener('error', function () { if (!window.__oddsStarted) window.__oddsFail(); });
    setTimeout(function () { if (!window.__oddsStarted) window.__oddsFail(); }, 15000);
  })();
</script>

<main class="page">
  <p id="notice" class="notice" role="note"></p>

  <div id="panel-games" class="tab-panel" role="tabpanel" aria-labelledby="tab-games">
    <div class="toolbar">
      <nav id="sport-filter" class="chips" aria-label="sport"></nav>
      <nav id="day-filter" class="chips" aria-label="day"></nav>
    </div>
    <div id="legend" class="key-legend"></div>

    <section id="ranking" class="card ranking-card">
      <div class="ranking-head">
        <h2 id="ranking-title"></h2>
        <p class="lede" data-t="rankingSub"></p>
      </div>
      <ol id="ranking-podium" class="podium"></ol>
      <div id="ranking-notes" class="ranking-notes"></div>
      <details class="ranking-more">
        <summary id="ranking-more-label"></summary>
        <ol id="ranking-list" class="ranking-list"></ol>
      </details>
    </section>

    <section id="games" aria-labelledby="games-title">
      <h2 id="games-title" class="section-heading"></h2>
      <div id="games-list" class="games-grid"></div>
    </section>

    <section id="f1" aria-labelledby="f1-title">
      <h2 id="f1-title" class="section-heading"></h2>

    </section>

    <section id="futures" aria-labelledby="futures-title">

  <div id="panel-slip" class="tab-panel" role="tabpanel" aria-labelledby="tab-slip">

      <div id="parlay-body"></div>
    </section>
  </div>

  <div id="panel-sim" class="tab-panel" role="tabpanel" aria-labelledby="tab-sim">
    <section id="sim" aria-labelledby="sim-title">
      <div class="sim-top">
        <div>
          <h2 id="sim-title" class="section-heading"></h2>
          <p class="lede" data-t="simIntro"></p>
        </div>
        <div id="sim-periods" class="segmented" role="group"></div>
        <select id="sim-weeks" hidden>
          <option value="4">4</option>
          <option value="13">13</option>
          <option value="26">26</option>
          <option value="52" selected>52</option>
          <option value="156">156</option>
        </select>
      </div>
      <div class="card hero-card">
        <div id="sim-headline" class="sim-headline" aria-live="polite"></div>
        <div id="sim-stats" class="kpis"></div>
      </div>
      <div class="card">
        <div id="sim-legend" class="legend"></div>
        <div id="sim-chart" class="chart"></div>
      </div>
      <div id="sim-players" class="players"></div>
      <div class="two-col">
        <div class="card">
          <h3 class="card-title" data-t="habitsTitle"></h3>
          <ol id="sim-habits" class="bars-list"></ol>
        </div>
        <div class="card">
          <h3 class="card-title" data-t="fansTitle"></h3>
          <ol id="sim-fans" class="bars-list"></ol>
        </div>
      </div>
      <div class="two-col">
        <div class="card">
          <h3 class="card-title" data-t="youTitle"></h3>
          <p class="lede" data-t="youIntro"></p>
          <div class="you-pickers">
            <select id="you-habit" aria-label="habit"></select>
            <select id="you-fan" aria-label="fan"></select>
          </div>
          <div id="you-result"></div>
        </div>
        <div class="card">
          <h3 class="card-title" data-t="lookupTitle"></h3>
          <p class="lede" data-t="lookupIntro"></p>
          <form id="lookup-form" class="lookup-form">
            <input id="lookup-number" type="number" inputmode="numeric" min="1" step="1" aria-label="#" />
            <button class="primary-button" type="submit" data-t="lookupGo"></button>
            <button id="lookup-random" class="ghost-button" type="button" data-t="lookupRandom"></button>
          </form>
          <div id="lookup-result"></div>
        </div>
      </div>
      <h3 class="section-heading small" data-t="storiesTitle"></h3>
      <ul id="sim-stories" class="stories"></ul>
      <div class="two-col">
        <div class="card truth-card">

        </div>
        <div class="card detail-only">

        </div>

        <summary><span data-t="simTable"></span></summary>
